# VPS.Taxi client API relay.
#
# The upstream requires a bearer token and answers no CORS preflight, so the
# browser cannot call it directly. Drop this into the server block that serves
# the dashboard, put the token in the included file, and point the dashboard at
# https://<host>/vps-taxi/api/v1.
#
#   install -m 600 /dev/null /etc/nginx/snippets/vps-taxi-token.conf
#   printf 'set $vps_taxi_token "ca_REPLACE_ME";\n' > /etc/nginx/snippets/vps-taxi-token.conf
#
# Without a token in the dashboard the request stays a simple GET, so keeping
# the key here also keeps every request out of the preflight path.

location /vps-taxi/api/v1/ {
    include /etc/nginx/snippets/vps-taxi-token.conf;

    # The browser preflights as soon as it sends Authorization itself; answer
    # here instead of forwarding an OPTIONS the upstream rejects with 405.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Accept" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Content-Length               0;
        return 204;
    }

    proxy_pass https://my.vps.taxi/plugin/client_api/api/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host my.vps.taxi;
    proxy_set_header Authorization "Bearer $vps_taxi_token";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;

    # The dashboard is often served from another origin (a router panel), so the
    # response has to be readable there. The API is read-only and the token
    # never leaves this host.
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Vary Origin always;
}
